name: CI Checks

on:
    pull_request: 
        branches: [dev]
   

jobs:
      build-and-test:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Build Docker CI image
            run: docker build -t tividy-ci:latest .

          - name: Run unit tests
            run: docker run --rm tividy-ci:latest make test

          - name: Run Valgrind memory check
            run: docker run --rm tividy-ci:latest make valgrind